<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
    <title>GanaJakten</title>
    <script>navigator.serviceWorker.register("./service-worker.js")</script> 
    <link rel="stylesheet" href="main.css?version=1.0">
    <link rel="manifest" href="./manifest.json?version=1.0">
</head>
<body>
    <div class="container">
        <div class="title">GANA QUIZ</div>
        <fieldset>
            <div class="quiz">
                <div>
                    <label for="eplQuiz" class="quizButton" onclick="startQuiz('epl')">EPL Quiz</label>
                </div>
                
                <div>
                    <label for="swedenQuiz" class="quizButton" onclick="startQuiz('sweden')">Sweden Quiz</label>
                </div>

                <div>
                    <label for="randomQuiz" class="quizButton" onclick="startQuiz('random')">Random Quiz</label>
                </div>
            </div>
        </fieldset>
    </div>

    <script>
        function startQuiz(quiz) {
            localStorage.clear();
            sessionStorage.clear();

            if ('caches' in window) {
                caches.keys().then((names) => {
                    names.forEach((name) => caches.delete(name));
                });
            }

            document.body.classList.add('fade-out');
            
            setTimeout(() => {
                window.location.href = quiz + ".html";
            }, 500);
        }
    </script>
</body>
</html>
